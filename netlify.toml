[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Clean URLs (no .html required)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/start"
  to = "/start.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# Legacy folder URLs → new root files
[[redirects]]
  from = "/start/"
  to = "/start.html"
  status = 301

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard.html"
  status = 301

# TikTok Login Kit routes
[[redirects]]
  from = "/api/auth/tiktok"
  to = "/.netlify/functions/auth-tiktok"
  status = 200

[[redirects]]
  from = "/api/auth/tiktok/callback"
  to = "/.netlify/functions/auth-tiktok-callback"
  status = 200
