[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pretty URLs — no .html in the address bar
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/start"
  to = "/start.html"
  status = 200

[[redirects]]
  from = "/start/"
  to = "/start.html"
  status = 200

[[redirects]]
  from = "/start.html"
  to = "/start"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/safety"
  to = "/safety/index.html"
  status = 200

[[redirects]]
  from = "/safety/"
  to = "/safety/index.html"
  status = 200

# TikTok Login Kit (Netlify Functions)
[[redirects]]
  from = "/api/auth/tiktok"
  to = "/.netlify/functions/auth-tiktok"
  status = 200

[[redirects]]
  from = "/api/auth/tiktok/callback"
  to = "/.netlify/functions/auth-tiktok-callback"
  status = 200
