[build]
  command = "npm run build"
  publish = "dist"

# Clean URLs (no .html required)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/start"
  to = "/start.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# Legacy folder URLs → new root files
[[redirects]]
  from = "/start/"
  to = "/start.html"
  status = 301

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard.html"
  status = 301
