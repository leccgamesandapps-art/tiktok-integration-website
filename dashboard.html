<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Dashboard — Keepclip</title>
    <meta name="description" content="Keepclip saves TikTok videos to your own cloud archive — they stay watchable and downloadable even if the original is deleted." />
    <script>
      // Instant gate: no account → /start (skip if OAuth return has ?tiktok=)
      try {
        if (!/\btiktok=/.test(location.search)) {
          var raw = localStorage.getItem('keepclip.cloud.v2');
          var hasUser = false;
          if (raw) {
            var s = JSON.parse(raw);
            hasUser = !!(s && s.user);
          }
          if (!hasUser) location.replace('/start');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-dashboard.tsx"></script>
  </body>
</html>
